<template>
    <!-- Header -->
    <div class="slds-card slds-m-bottom_medium">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:news" alternative-text="New Stories" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title slds-truncate">
                        <span>New Stories – Hacker News</span>
                        <span class="slds-m-left_small slds-text-body_small slds-text-color_weak">({stories.length} loaded)</span>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <lightning-button label="Refresh" icon-name="utility:refresh" variant="neutral" onclick={handleRefresh} disabled={isLoading}></lightning-button>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <!-- Error -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{error}</h2>
                    <lightning-button label="Retry" variant="neutral" onclick={handleRefresh} class="slds-m-left_small"></lightning-button>
                </div>
            </template>

            <!-- Empty -->
            <template if:true={isEmpty}>
                <div class="slds-illustration slds-illustration_small slds-text-align_center slds-p-vertical_large">
                    <p class="slds-text-heading_small">No stories found.</p>
                </div>
            </template>

            <!-- Tiles Grid: 3 per row on desktop, 2 on tablet, 1 on mobile -->
            <template if:true={hasStories}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={stories} for:item="story">
                        <div key={story.itemId} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                            <article class="tile slds-card slds-card_boundary">
                                <!-- Tile Header -->
                                <div class="slds-card__header slds-grid slds-p-around_small" style="background:#f3f6f9; border-bottom:1px solid #e5e5e5;">
                                    <div class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__figure">
                                            <span class="slds-badge slds-theme_success">{story.score} pts</span>
                                        </div>
                                        <div class="slds-media__body slds-truncate">
                                            <span class="slds-text-title slds-text-color_weak">#{story.itemId} • {story.itemType}</span>
                                        </div>
                                    </div>
                                </div>
                                <!-- Tile Body -->
                                <div class="slds-card__body slds-card__body_inner slds-p-around_medium" style="min-height:140px;">
                                    <h3 class="slds-text-heading_small slds-m-bottom_x-small slds-line-clamp" title={story.title} style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; min-height:2.5rem;">
                                        {story.title}
                                    </h3>
                                    <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                        <span>by <b>{story.postedBy}</b></span>
                                        <span class="slds-m-left_x-small">• {story.formattedTime}</span>
                                    </div>
                                    <template if:true={story.hasUrl}>
                                        <a href={story.url} target="_blank" class="slds-text-link slds-text-body_small slds-truncate" style="display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title={story.url}>{story.url}</a>
                                    </template>
                                    <template if:false={story.hasUrl}>
                                        <span class="slds-text-body_small slds-text-color_weak">No external URL</span>
                                    </template>
                                </div>
                                <!-- Tile Footer -->
                                <div class="slds-card__footer slds-grid slds-grid_align-spread slds-p-around_small" style="border-top:1px solid #e5e5e5;">
                                    <span class="slds-badge">
                                        <lightning-icon icon-name="utility:comments" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {story.descendants} comments
                                    </span>
                                    <span class="slds-text-body_small slds-text-color_weak">{story.kidsCount} kids</span>
                                    <template if:true={story.hasUrl}>
                                        <lightning-button label="Open" variant="brand" size="small" data-url={story.url} onclick={handleOpenUrl}></lightning-button>
                                    </template>
                                </div>
                            </article>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-p-vertical_medium">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    <p class="slds-m-top_small slds-text-color_weak">Loading new stories…</p>
                </div>
            </template>

            <!-- Auto infinite scroll sentinel + fallback button -->
            <div class="slds-text-align_center slds-m-top_medium">
                <template if:true={hasMore}>
                    <div class="auto-scroll-sentinel" style="height:1px; width:100%;"></div>
                    <lightning-button label="Load More" variant="neutral" icon-name="utility:down" onclick={handleLoadMore} disabled={isLoading} class="slds-m-top_small"></lightning-button>
                    <p class="slds-text-color_weak slds-text-body_small slds-m-top_x-small">Scroll down to load more automatically</p>
                </template>
                <template if:false={hasMore}>
                    <span class="slds-text-color_weak slds-text-body_small">No more stories.</span>
                </template>
            </div>
        </div>
    </div>
</template>
